name: Publish the site to GitHub Pages
# Builds the production site in CI and publishes it when main changes. A pull request builds and audits the same
# artifact without deploying, so this exact workflow is exercised before it merges. A manual run redeploys main.
# GitHub ignores a CNAME file for workflow deployments, so the custom domain is set in the Pages settings.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A pull request run must never queue behind, or replace, a pending deploy, so it gets its own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pins match site.yml and the archive repositories: checkout v7.0.1, setup-node v7.1.0,
      # upload-pages-artifact v5.0.0, deploy-pages v5.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the locked dependencies without running package scripts
        run: npm ci --ignore-scripts
      - name: Validate the catalog files
        run: python3 -I scripts/check_catalog.py
      - name: Build production (published records only)
        run: npm run build:production
      - name: Audit the production output, including that no unreviewed record leaks into it
        run: python3 -I scripts/check_output.py production dist-production
      - name: Package the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist-production/
          retention-days: 3
  deploy:
    # Only a push to main or a manual run deploys. A pull request stops after the audited build.
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
