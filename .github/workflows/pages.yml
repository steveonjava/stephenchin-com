name: Publish placeholder to GitHub Pages
# Started by hand from the Actions tab, and only after the owner has set the Pages source to GitHub Actions.
# GitHub ignores a CNAME file for workflow deployments, so the custom domain is set in the Pages settings.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pins match the archive repositories: checkout v7.0.1, upload-pages-artifact v5.0.0, deploy-pages v5.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate the pages
        run: python3 scripts/check.py
      - name: Stage only the published files
        run: |
          mkdir _site
          cp index.html 404.html style.css _site/
      - name: Package the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site/
          retention-days: 3
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
